<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2a3a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background gradient -->
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  
  <!-- Orange accent bar at top -->
  <rect width="400" height="4" fill="#FFA500"/>
  
  <!-- Center circle with orange border -->
  <circle cx="200" cy="150" r="45" fill="none" stroke="#FFA500" stroke-width="2" opacity="0.5"/>
  
  <!-- Inner circle -->
  <circle cx="200" cy="150" r="35" fill="none" stroke="#FFA500" stroke-width="1" opacity="0.3"/>
  
  <!-- Image icon (simplified camera) -->
  <g transform="translate(200, 150)">
    <!-- Camera body -->
    <rect x="-20" y="-15" width="40" height="30" rx="2" fill="none" stroke="#FFA500" stroke-width="1.5" opacity="0.7"/>
    <!-- Lens -->
    <circle cx="0" cy="0" r="8" fill="none" stroke="#FFA500" stroke-width="1.5" opacity="0.7"/>
    <!-- Flash -->
    <rect x="12" y="-12" width="4" height="4" fill="#FFA500" opacity="0.7"/>
  </g>
  
  <!-- Text placeholder -->
  <text x="200" y="250" font-family="Sora, sans-serif" font-size="14" fill="#FFA500" text-anchor="middle" opacity="0.6">No image available</text>
</svg>
